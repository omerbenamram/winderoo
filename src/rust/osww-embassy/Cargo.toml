[package]
name = "winderoo-embassy"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
winderoo-firmware = { path = "../osww-firmware", default-features = false }
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
heapless = "0.8"

# Embassy + ESP32 HAL (pure Rust stack)
embassy-executor = { version = "0.5", features = ["arch-xtensa", "executor-thread", "integrated-timers"] }
embassy-time = { version = "0.3", features = ["tick-hz-1_000"] }
embassy-sync = "0.5"
esp-hal = { version = "0.18", features = ["esp32", "embassy"] }
static_cell = "2.0"

panic-halt = "0.2"

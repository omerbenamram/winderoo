[package]
name = "winderoo-embassy"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
winderoo-firmware = { path = "../osww-firmware", default-features = false }
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io-async = "0.6"
embedded-storage = "0.3"
heapless = "0.9"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
picoserve = { version = "0.17.1", default-features = false, features = ["alloc"] }
ssd1306 = { version = "0.10", default-features = false, features = ["graphics"], optional = true }
embedded-graphics = { version = "0.8.1", default-features = false, optional = true }

# Embassy + ESP32 HAL (pure Rust stack)
embassy-executor = { version = "0.9", optional = true }
embassy-time = { version = "0.5", features = ["tick-hz-1_000_000"], optional = true }
embassy-sync = "0.7"
embassy-futures = { version = "0.1.2", optional = true }
embassy-net = { version = "0.7", optional = true }
esp-hal = { version = "1.0", optional = true }
esp-radio = { version = "0.17", optional = true }
static_cell = { version = "2.1", optional = true }

panic-halt = { version = "0.2", optional = true }

[dev-dependencies]
futures = "0.3"

[features]
default = []
oled = ["dep:ssd1306", "dep:embedded-graphics"]
embedded = [
  "dep:embassy-executor",
  "dep:embassy-time",
  "dep:embassy-futures",
  "dep:embassy-net",
  "dep:esp-hal",
  "dep:esp-radio",
  "dep:static_cell",
  "picoserve/embassy",
  "dep:panic-halt",
]
esp32 = [
  "embedded",
  "esp-hal/esp32",
  "esp-hal/unstable",
  "esp-radio/esp32",
  "esp-radio/wifi",
  "esp-radio/unstable",
]

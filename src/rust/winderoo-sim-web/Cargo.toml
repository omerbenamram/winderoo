[package]
name = "winderoo-sim-web"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WASM-based simulator for Winderoo watch winder"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
winderoo-firmware = { path = "../osww-firmware", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1", optional = true }

# Same graphics library used by the real firmware display
embedded-graphics = "0.8"
heapless = "0.8"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true

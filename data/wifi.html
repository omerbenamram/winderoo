<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Winderoo Wi‑Fi Setup</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #111a2e;
        --text: #e7ecff;
        --muted: #a7b1d6;
        --accent: #6ea8fe;
        --danger: #ff6b6b;
        --ok: #45d483;
        --border: rgba(231, 236, 255, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background: radial-gradient(1200px 700px at 20% -10%, rgba(110,168,254,.25), transparent 60%),
          radial-gradient(900px 600px at 100% 10%, rgba(69,212,131,.18), transparent 55%),
          var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 520px;
        background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 18px 60px rgba(0,0,0,.35);
        backdrop-filter: blur(10px);
      }
      h1 {
        margin: 0 0 6px;
        font-size: 20px;
        letter-spacing: .2px;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin: 12px 0 6px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(17, 26, 46, 0.7);
        color: var(--text);
        outline: none;
      }
      input:focus {
        border-color: rgba(110,168,254,.55);
        box-shadow: 0 0 0 4px rgba(110,168,254,.15);
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 14px;
      }
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        padding: 10px 12px;
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(110,168,254,1), rgba(82,145,255,1));
        color: #071023;
        font-weight: 700;
        flex: 1;
      }
      button:disabled {
        opacity: .6;
        cursor: not-allowed;
      }
      .ghost {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        font-weight: 600;
      }
      .status {
        margin-top: 12px;
        font-size: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(17, 26, 46, 0.55);
        color: var(--muted);
        display: none;
        white-space: pre-wrap;
      }
      .status.ok { color: var(--ok); }
      .status.err { color: var(--danger); }
      .footer {
        margin-top: 14px;
        font-size: 11px;
        color: rgba(167, 177, 214, 0.75);
      }
      .footer code { color: rgba(231,236,255,.8); }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Winderoo Wi‑Fi Setup</h1>
      <p>
        Enter your network credentials to connect this device.
        After submitting, stay connected to the <code>Winderoo Setup</code> network until Winderoo joins your Wi‑Fi.
      </p>

      <form id="wifi-form">
        <label for="ssid">SSID</label>
        <input id="ssid" name="ssid" autocomplete="off" spellcheck="false" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="off" spellcheck="false" />

        <div class="row">
          <button id="submit" type="submit">Connect</button>
          <button id="statusBtn" class="ghost" type="button">Check status</button>
        </div>
      </form>

      <div id="status" class="status"></div>
      <div class="footer">
        Tip: main UI is at <code>/app</code> (or <code>/</code> on normal Wi‑Fi), and device state is at <code>/api/status</code>.
      </div>
    </div>

    <script>
      const form = document.getElementById("wifi-form");
      const statusEl = document.getElementById("status");
      const submitBtn = document.getElementById("submit");
      const statusBtn = document.getElementById("statusBtn");

      function showStatus(text, kind) {
        statusEl.style.display = "block";
        statusEl.classList.remove("ok", "err");
        if (kind) statusEl.classList.add(kind);
        statusEl.textContent = text;
      }

      async function checkStatus() {
        try {
          const res = await fetch("/api/status", { cache: "no-store" });
          if (!res.ok) throw new Error("status HTTP " + res.status);
          const json = await res.json();
          showStatus(
            "Connected: " + (json.db ? "maybe" : "unknown") + "\\n" +
            "RSSI (db): " + json.db + "\\n" +
            "Winder: " + json.status,
            "ok"
          );
        } catch (e) {
          showStatus("Failed to fetch /api/status: " + e, "err");
        }
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const ssid = document.getElementById("ssid").value.trim();
        const password = document.getElementById("password").value;
        if (!ssid) {
          showStatus("SSID is required.", "err");
          return;
        }

        submitBtn.disabled = true;
        showStatus("Sending credentials…", null);

        try {
          const res = await fetch("/api/wifi", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ssid, password }),
          });
          if (!res.ok && res.status !== 204) {
            const text = await res.text().catch(() => "");
            throw new Error("wifi HTTP " + res.status + " " + text);
          }
          showStatus(
            "Saved. Winderoo is now attempting to connect.\\n" +
            "On success it will reboot and the setup AP will disappear.",
            "ok"
          );
        } catch (e) {
          showStatus("Failed to save Wi‑Fi credentials: " + e, "err");
        } finally {
          submitBtn.disabled = false;
        }
      });

      statusBtn.addEventListener("click", () => checkStatus());
    </script>
  </body>
</html>
